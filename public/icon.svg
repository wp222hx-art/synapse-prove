<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2a2a4e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffea00"/>
      <stop offset="100%" stop-color="#ff6020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="80" ry="80"/>
  <!-- 六边形外框 -->
  <polygon points="256,76 432,178 432,334 256,436 80,334 80,178"
           fill="none" stroke="#ffea00" stroke-width="14" stroke-linejoin="round"/>
  <!-- 内层六边形 -->
  <polygon points="256,128 388,204 388,308 256,384 124,308 124,204"
           fill="#ffea00" fill-opacity="0.08" stroke="#ffea00" stroke-width="4"/>
  <!-- 中心爆炸光 -->
  <circle cx="256" cy="256" r="120" fill="url(#spark)"/>
  <circle cx="256" cy="256" r="32" fill="#ffffff"/>
</svg>
